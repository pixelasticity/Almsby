<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almsby — Every product has a story</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden Netlify Forms registration form — lets Netlify detect the SPA form at deploy time -->
    <form name="coming-soon" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="coming-soon" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
