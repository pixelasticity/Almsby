name: CI

on:
  push:
    branches: [master, development]
  pull_request:

jobs:
  almsby-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: i18n lint (key parity)
        run: npm run lint:i18n

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Prisma schema validation
        run: |
          # Schema-only validation; no real DB creds in CI, dummy URLs are enough.
          DATABASE_URL="postgresql://ci:ci@localhost:5432/ci" \
          DIRECT_URL="postgresql://ci:ci@localhost:5432/ci" \
          npx prisma validate

      - name: Resolver discipline (NEXT_PUBLIC_RESOLVER_URL allowed only in lib/env.ts, lib/gs1, tests)
        run: |
          FILES=$(grep -rln "NEXT_PUBLIC_RESOLVER_URL" --include="*.ts" --include="*.tsx" . || true)
          ALLOWED=$(printf '%s\n' "$FILES" | grep -vE '^(\./)?(lib/env\.ts|lib/gs1/|tests/)' || true)
          if [ -n "$ALLOWED" ]; then
            echo "Resolver URL referenced outside allowed files (lib/env.ts, lib/gs1/, tests/):" >&2
            echo "$ALLOWED" >&2
            exit 1
          fi
          echo "Resolver discipline OK"