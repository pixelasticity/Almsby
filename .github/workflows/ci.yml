name: CI

on:
  push:
    branches: [master, development]
  pull_request:

jobs:
  almsby-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: i18n lint (key parity)
        run: npm run lint:i18n

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke test (server boots + health check)
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_RESOLVER_URL: https://resolver.almsby.io
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-key
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health | grep -q '"ok":true' || {
            echo "Health check failed" >&2
            exit 1
          }
          echo "Health check passed"

      - name: Prisma schema validation
        run: |
          # Schema-only validation; no real DB creds in CI, dummy URLs are enough.
          DATABASE_URL="postgresql://ci:ci@localhost:5432/ci" \
          DIRECT_URL="postgresql://ci:ci@localhost:5432/ci" \
          npx prisma validate

      - name: Resolver discipline (NEXT_PUBLIC_RESOLVER_URL allowed only in lib/env.ts, lib/gs1, tests)
        run: |
          FILES=$(grep -rln "NEXT_PUBLIC_RESOLVER_URL" --include="*.ts" --include="*.tsx" . || true)
          ALLOWED=$(printf '%s\n' "$FILES" | grep -vE '^(\./)?(lib/env\.ts|lib/gs1/|tests/)' || true)
          if [ -n "$ALLOWED" ]; then
            echo "Resolver URL referenced outside allowed files (lib/env.ts, lib/gs1/, tests/):" >&2
            echo "$ALLOWED" >&2
            exit 1
          fi
          echo "Resolver discipline OK"
