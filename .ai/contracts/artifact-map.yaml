schema_version: "1.1"
artifact_map:
  planning:
    required:
      - project.yaml
      - brief.md
      - contract-preflight.md
      - impact-assessment.md
  design:
    required_when_ui_or_ux_changes:
      - ux-brief.md
      - visual-direction.md
      - design-plan.md
    conditional:
      - product-review.md
      - decisions.md
  implementation:
    required_when_code_changes:
      - implementation-report.md
  verification:
    required_for_ui_work:
      - browser-evidence
      - browser-validation-report.json
    conditional:
      - accessibility-evidence.yaml
      - responsive-evidence.yaml
      - physical-scan-evidence.yaml
      - i18n-evidence.yaml
      - compliance-evidence.yaml
  review:
    required:
      - critique.md
      - final-review.yaml
  completion:
    required:
      - project.yaml
      - final-review.yaml

paths:
  browser_evidence_root: evidence/browser
  browser_validation_report: browser-validation-report.json

artifact_status_values:
  - planned
  - in_progress
  - present
  - verified
  - failed
  - blocked
  - unknown

rules:
  missing_required_artifact: "fail"
  unknown_required_artifact: "fail"
  failed_required_artifact: "fail"
  generated_run_data_is_ephemeral: true
